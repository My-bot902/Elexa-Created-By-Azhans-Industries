<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELEXA | AI INTERFACE</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00d2ff;
            --neon-purple: #9d50bb;
            --bg-dark: #0a0b10;
        }

        body {
            background: var(--bg-dark);
            color: white;
            font-family: 'Rajdhani', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            padding: 15px;
            box-sizing: border-box;
        }

        /* Background Animation Circles */
        .bg-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: var(--neon-blue);
            filter: blur(150px);
            opacity: 0.2;
            z-index: -1;
            animation: move 10s infinite alternate;
        }

        @keyframes move {
            from { transform: translate(-50%, -50%) scale(0); }
            to { transform: translate(50%, 50%) scale(2); }
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px 20px;
            border-radius: 20px;
            width: 450px;
            max-width: 100%;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 5px;
            margin-top: 10px;
            margin-bottom: 20px;
            background: linear-gradient(to right, var(--neon-blue), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .input-group {
            position: relative;
            margin-bottom: 10px;
            width: 100%;
        }

        input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--neon-blue);
            padding: 15px;
            border-radius: 30px;
            color: white;
            outline: none;
            font-size: 1.1rem;
            transition: 0.3s;
            box-sizing: border-box;
            text-align: center;
        }

        input:focus {
            box-shadow: 0 0 15px var(--neon-blue);
        }

        /* 🟢 Dynamic Typewriter Teaser Area */
        .typewriter-box {
            min-height: 24px;
            margin-bottom: 15px;
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
        }

        #typewriter-text {
            color: var(--neon-blue);
            font-weight: bold;
            border-right: 2px solid var(--neon-blue);
            white-space: nowrap;
            animation: cursor-blink 0.75s step-end infinite;
        }

        @keyframes cursor-blink {
            from, to { border-color: transparent }
            50% { border-color: var(--neon-blue); }
        }

        /* 🔵 Interactive FAQ Section */
        .faq-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--neon-purple);
            margin-bottom: 10px;
            font-weight: bold;
        }

        .faq-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
            max-height: 120px;
            overflow-y: auto;
            padding: 5px;
        }

        /* Custom Scrollbar FAQ items ke liye */
        .faq-grid::-webkit-scrollbar {
            width: 3px;
        }
        .faq-grid::-webkit-scrollbar-thumb {
            background: var(--neon-purple);
            border-radius: 10px;
        }

        .faq-badge {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 210, 255, 0.3);
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s ease-in-out;
            color: rgba(255, 255, 255, 0.85);
        }

        .faq-badge:hover {
            background: rgba(0, 210, 255, 0.1);
            border-color: var(--neon-blue);
            transform: translateY(-2px);
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.2);
        }

        button.initiate-btn {
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-purple));
            border: none;
            padding: 15px 30px;
            border-radius: 30px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
            width: 100%;
        }

        button.initiate-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 0 20px var(--neon-purple);
        }

        #response {
            margin-top: 20px;
            padding: 15px;
            min-height: 50px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            font-size: 1.1rem;
            color: var(--neon-blue);
            border-left: 3px solid var(--neon-purple);
            text-align: left;
            word-wrap: break-word;
        }

        .visualizer {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-bottom: 15px;
        }

        .bar {
            width: 4px;
            height: 10px;
            background: var(--neon-blue);
        }

        .animating .bar {
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% { height: 10px; }
            50% { height: 30px; }
        }

        /* 📱 360px Mobile Optimization Constraints */
        @media (max-width: 400px) {
            .container {
                padding: 20px 15px;
                border-radius: 15px;
            }

            h1 {
                font-size: 1.6rem;
                letter-spacing: 2px;
                margin-bottom: 15px;
            }

            input {
                font-size: 0.95rem;
                padding: 12px;
            }

            .faq-badge {
                padding: 5px 10px;
                font-size: 0.75rem;
            }

            button.initiate-btn {
                padding: 12px;
                font-size: 0.9rem;
            }

            #response {
                font-size: 0.95rem;
                padding: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>
    
    <div class="container">
        <div class="visualizer" id="visualizer-bars">
            <div class="bar" style="animation-delay: 0.1s"></div>
            <div class="bar" style="animation-delay: 0.2s"></div>
            <div class="bar" style="animation-delay: 0.3s"></div>
            <div class="bar" style="animation-delay: 0.4s"></div>
        </div>

        <h1>ELEXA AI</h1>
        
        <div class="input-group">
            <input type="text" id="userInput" placeholder="Tap here to speak or type..." onclick="startMobileVoice()" onkeypress="handleKeyPress(event)">
        </div>

        <!-- 🟢 Dynamic Typewriter Field -->
        <div class="typewriter-box">
            <span>Try asking:</span>
            <span id="typewriter-text"></span>
        </div>

        <!-- 🔵 Clean FAQ Shortcuts Section -->
        <div class="faq-title">Quick Tasks Dashboard</div>
        <div class="faq-grid">
            <div class="faq-badge" onclick="triggerQuickTask('open google ai')">🧠 Google AI</div>
            <div class="faq-badge" onclick="triggerQuickTask('open pixverse')">🤖 Pixverse</div>
            <div class="faq-badge" onclick="triggerQuickTask('open tiktok')">🎵 TikTok</div>
            <div class="faq-badge" onclick="triggerQuickTask('open instagram')">📸 Instagram</div>
            <div class="faq-badge" onclick="triggerQuickTask('open poki games website')">🎮 Poki Games</div>
            <div class="faq-badge" onclick="triggerQuickTask('about azhan')">👑 Azhan</div>
            <div class="faq-badge" onclick="triggerQuickTask('about atif')">✨ Atif</div>
            <div class="faq-badge" onclick="triggerQuickTask('about umair')">🤫 Umair</div>
            <div class="faq-badge" onclick="triggerQuickTask('about shah g')">🎭 Shah G</div>
            <div class="faq-badge" onclick="triggerQuickTask('about imtiaz')">⚡ Imtiaz</div>
            <div class="faq-badge" onclick="triggerQuickTask('about basit')">💎 Basit</div>
            <div class="faq-badge" onclick="triggerQuickTask('naam kia hai')">❓ Naam Kya Hai</div>
        </div>
        
        <button class="initiate-btn" onclick="sendMessage()">Initiate Command</button>
        
        <div id="response">Waiting for input...</div>
    </div>

    <script>
    // 1. Target strings for the requested looped configuration
    const teaserPhrases = [
        "open playstore",
        "open youtube",
        "who is asad?",
        "who is naveed?",
        "who is ali?"
    ];

    let loopIndex = 0;
    let charIndex = 0;
    let deletingActive = false;

    function runTypewriterLoop() {
        const textElement = document.getElementById("typewriter-text");
        if (!textElement) return;

        const currentPhrase = teaserPhrases[loopIndex];

        if (deletingActive) {
            textElement.textContent = currentPhrase.substring(0, charIndex - 1);
            charIndex--;
        } else {
            textElement.textContent = currentPhrase.substring(0, charIndex + 1);
            charIndex++;
        }

        if (!deletingActive && charIndex === currentPhrase.length) {
            deletingActive = true;
            setTimeout(runTypewriterLoop, 2000); // Wait on complete phrase
        } else if (deletingActive && charIndex === 0) {
            deletingActive = false;
            loopIndex = (loopIndex + 1) % teaserPhrases.length;
            setTimeout(runTypewriterLoop, 400); // Pause before next phrase
        } else {
            setTimeout(runTypewriterLoop, deletingActive ? 40 : 80);
        }
    }

    // Initialize looping automatically when document models parse
    window.addEventListener("DOMContentLoaded", () => {
        runTypewriterLoop();
    });

    // 2. Interactive quick-badge function configuration
    function triggerQuickTask(commandText) {
        document.getElementById("userInput").value = commandText;
        sendMessage(); // Direct zero-click execution engine trigger
    }

    // 3. Mobile Browser Speech Synthesis Engine (Local execution)
    function speakOutLoud(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel(); 
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-GB'; 
            utterance.rate = 1.0;     
            utterance.pitch = 1.1;    
            window.speechSynthesis.speak(utterance);
        }
    }

    // 4. Mobile Browser Speech-To-Text Interface API
    function startMobileVoice() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) return;
        
        const recognition = new SpeechRecognition();
        recognition.lang = 'en-IN';
        
        const visualizer = document.getElementById("visualizer-bars");
        const inputField = document.getElementById("userInput");

        recognition.onstart = function() {
            visualizer.classList.add("animating");
            inputField.placeholder = "Listening smoothly...";
        };

        recognition.onspeechend = function() {
            recognition.stop();
            visualizer.classList.remove("animating");
            inputField.placeholder = "Tap here to speak or type...";
        };

        recognition.onresult = function(event) {
            const transcript = event.results[0][0].transcript;
            inputField.value = transcript;
            sendMessage();
        };

        recognition.onerror = function() {
            visualizer.classList.remove("animating");
        };

        recognition.start();
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    }

    // 5. Central Request Engine Execution Logic
    function sendMessage() {
        const inputField = document.getElementById("userInput");
        const responseDiv = document.getElementById("response");
        const visualizer = document.getElementById("visualizer-bars");
        
        const userCommand = inputField.value.trim();
        
        if (userCommand === "") {
            responseDiv.innerText = "Kuch likho ya bolo boss!";
            return;
        }

        responseDiv.innerText = "Processing command...";
        visualizer.classList.add("animating");

        fetch('/ask', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ message: userCommand })
        })
        .then(res => res.json())
        .then(data => {
            visualizer.classList.remove("animating");
            responseDiv.innerText = data.reply;
            
            speakOutLoud(data.reply);
            
            if (data.action === "open_url" && data.url !== "") {
                setTimeout(() => {
                    window.open(data.url, '_blank');
                }, 1500);
            }
        })
        .catch(err => {
            console.error(err);
            visualizer.classList.remove("animating");
            responseDiv.innerText = "Error contacting Elexa cloud server.";
        });
    }
    </script>
</body>
</html>
